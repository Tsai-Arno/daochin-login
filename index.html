<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>道親查詢系統 — Google 登入</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
    }
    .card {
      background: #fff; padding: 32px 28px; border-radius: 14px; width: 92%; max-width: 400px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08); text-align: center;
    }
    h2 { margin: 0 0 10px; color: #0f4c5c; font-size: 22px; }
    p { color: #64748b; font-size: 15px; margin: 0 0 24px; line-height: 1.6; }
    .btn-google {
      width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 8px;
      background: #fff; color: #1e293b; font-size: 16px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-google:hover { background: #f8fafc; border-color: #0f4c5c; }
    .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }
    #statusMsg { margin-top: 16px; font-size: 14px; color: #dc2626; min-height: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>道親查詢系統</h2>
    <p>請使用您登入「白陽 APP」的 Google 帳號進行驗證，驗證完成後將自動進入查詢頁面。</p>
    <button id="loginBtn" class="btn-google" onclick="loginWithGoogle()">
      使用 Google 帳號登入
    </button>
    <div id="statusMsg"></div>
  </div>

  <script>
    // 【必填】請換成您的 GAS 網頁應用程式正式網址（結尾為 /exec）
    var GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzzYd20MszL-cWelV95kaXhnw5HI8KTQPCIC_pS5JBMynwCs1GbBclqumnRuO2aG--lJw/exec';

    firebase.initializeApp({
      apiKey: 'AIzaSyDbRTMxwNzPM2cOLFrOU80s744SmvsPJpM',
      authDomain: 'arnotest-at.firebaseapp.com',
      projectId: 'arnotest-at'
    });

    function loginWithGoogle() {
      var btn = document.getElementById('loginBtn');
      var msg = document.getElementById('statusMsg');
      btn.disabled = true;
      msg.style.color = '#0f4c5c';
      msg.textContent = '正在開啟 Google 登入視窗...';

      var provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      firebase.auth().signInWithPopup(provider)
        .then(function(result) {
          msg.textContent = '驗證成功，正在進入道親查詢系統...';
          return result.user.getIdToken(true);
        })
        .then(function(idToken) {
          window.location.href = GAS_WEB_APP_URL + '?token=' + encodeURIComponent(idToken);
        })
        .catch(function(err) {
          btn.disabled = false;
          msg.style.color = '#dc2626';
          msg.textContent = '登入失敗：' + (err.message || err);
        });
    }
  </script>
</body>
</html>
